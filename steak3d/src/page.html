<title>Steak</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  :root { color-scheme: dark; --fg:#eee6db; --dim:#b2a798; --faint:#7c7267; --ember:#ee8a3c; --line:rgba(255,255,255,.12); --panel:rgba(14,12,11,.72); --sage:#94c28a; --amber:#e3b54f; --rose:#e36b5b;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing: border-box; } [hidden]{display:none!important}
  html,body { margin:0; height:100%; background:#050505; color:var(--fg); font:400 14px/1.45 var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas#c.holding { cursor:grabbing; } canvas#c.canpick { cursor:grab; } canvas#c.knob { cursor:ew-resize; }
  .vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  kbd { font:500 10.5px/1 var(--mono); padding:2px 5px; border-radius:4px; border:1px solid var(--line); color:var(--dim); background:rgba(255,255,255,.04); }
  button { font:inherit; color:inherit; cursor:pointer; }
  .glass { background:var(--panel); border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #stats { position:fixed; left:16px; top:16px; padding:12px 14px; min-width:210px; display:grid; gap:7px; }
  #stats .t { font:500 11px/1 var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--ember); }
  #stats .t b { color:var(--fg); font-weight:500; letter-spacing:.02em; text-transform:none; font-size:13px; margin-left:6px; }
  .ro { display:grid; grid-template-columns:70px 1fr; align-items:baseline; gap:8px; }
  .ro .l { color:var(--faint); font-size:11px; letter-spacing:.06em; text-transform:uppercase; } .ro .v { font-size:18px; } .ro .s { grid-column:2; color:var(--dim); font-size:12px; margin-top:-4px; }
  .bar { height:4px; border-radius:3px; background:rgba(255,255,255,.1); overflow:hidden; } .bar i { display:block; height:100%; background:var(--ember); width:0; transition:width .15s; }
  #top { position:fixed; right:16px; top:16px; display:flex; gap:8px; }
  .pill { background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:7px 12px; font-size:12px; color:var(--dim); }
  .pill[aria-pressed=true] { color:var(--fg); border-color:rgba(238,138,60,.55); }
  #hint { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); max-width:min(640px,calc(100vw - 32px)); padding:10px 16px; text-align:center; color:var(--fg); font-size:14px; }
  #hint .k { display:block; margin-top:6px; color:var(--faint); font-size:12px; }
  #actions { position:fixed; right:16px; bottom:16px; display:grid; gap:8px; justify-items:end; }
  .btn { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13px; backdrop-filter:blur(10px); }
  .btn:hover { border-color:rgba(255,255,255,.3); } .btn.primary { background:var(--ember); border-color:var(--ember); color:#1a0e05; font-weight:600; }
  .btn[aria-pressed=true] { border-color:var(--ember); color:var(--ember); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  #dialBox { position:fixed; left:16px; bottom:16px; padding:12px 14px; width:210px; }
  #dialBox .row { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:8px; }
  input[type=range] { width:100%; accent-color:var(--ember); }
  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(5,5,5,.55); backdrop-filter:blur(3px); padding:16px; overflow:auto; }
  .card { width:min(560px,100%); padding:26px; }
  h1 { font:400 34px/1.05 Georgia,"Iowan Old Style",serif; margin:0 0 6px; } h2 { font:400 22px/1.1 Georgia,serif; margin:0 0 8px; }
  p.sub { margin:0 0 18px; color:var(--dim); }
  .grp { margin:14px 0 6px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:99px; padding:7px 13px; font-size:13px; }
  .chip[aria-pressed=true] { border-color:var(--ember); color:var(--ember); background:rgba(238,138,60,.1); }
  .go { margin-top:22px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .go .tip { color:var(--faint); font-size:12px; }
  #result .card { width:min(900px,100%); }
  .score { display:flex; align-items:baseline; gap:16px; margin-bottom:14px; } .score .big { font:400 64px/1 Georgia,serif; } .score small { font-size:20px; color:var(--faint); } .score .grade { font-size:16px; } .score .pb { color:var(--dim); font-size:12px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:22px; } @media(max-width:760px){ .cols{ grid-template-columns:1fr; } }
  ul.cats { list-style:none; padding:0; margin:0; display:grid; gap:9px; } ul.cats li { display:grid; grid-template-columns:1fr auto; gap:3px 10px; font-size:13px; } ul.cats li .bar { grid-column:1/-1; } ul.cats b { font-weight:500; } ul.cats small { color:var(--faint); }
  .fix { margin:0 0 12px; font-size:13px; } .fix b { display:block; font-weight:500; } .fix p { margin:2px 0 0; color:var(--dim); } .fix .cat { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ember); }
  #section { width:100%; height:auto; display:block; margin-top:6px; } .secnote { color:var(--dim); font-size:12px; margin:4px 0 12px; }
  #toast { position:fixed; left:50%; top:70px; transform:translateX(-50%); padding:8px 14px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; } #toast.on { opacity:1; }
  @media (max-width:700px){ #stats{ min-width:0; width:170px; padding:9px 10px;} .ro .v{font-size:15px} #dialBox{ bottom:70px; width:170px } #hint{ bottom:12px; font-size:12px } }
</style>
<canvas id="c" aria-label="A cast iron pan on a gas cooktop in a concrete room"></canvas>
<div class="vig"></div>

<div id="stats" class="glass" hidden>
  <div class="t"><span id="phase">Heat</span><b id="cutName"></b></div>
  <div class="ro"><span class="l">Pan</span><span class="v num" id="vPan">25 °C</span></div>
  <div class="ro"><span class="l">Core</span><span class="v num" id="vCore">6 °C</span><span class="s num" id="sCore"></span></div>
  <div class="bar"><i id="coreBar"></i></div>
  <div class="ro"><span class="l" id="lTime">Cook</span><span class="v num" id="vTime">0:00</span><span class="s num" id="sSpeed"></span></div>
</div>
<div id="top"><button class="pill" id="bHints" aria-pressed="true">Hints</button><button class="pill" id="bSound" aria-pressed="true">Sound</button><button class="pill" id="bQuality" aria-pressed="true">Effects</button></div>
<div id="dialBox" class="glass" hidden><div class="row"><label for="dial">Burner</label><output id="vDial" class="num">0%</output></div><input type="range" id="dial" min="0" max="100" step="1" value="0" aria-label="Burner"></div>
<div id="actions" hidden>
  <button class="btn" id="bBaste" aria-pressed="false">Baste <kbd>B</kbd></button>
  <button class="btn" id="bSpeed">Speed <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></button>
  <button class="btn" id="bReset">Reset steak <kbd>R</kbd></button>
  <button class="btn primary" id="bFinish" hidden>Slice and score <kbd>Enter</kbd></button>
  <button class="btn" id="bPull" hidden>Pull to rest <kbd>Enter</kbd></button>
</div>
<div id="hint" class="glass" hidden><span id="hintText"></span><span class="k" id="hintKeys"></span></div>
<div id="toast" class="glass" role="status"></div>

<div id="start" class="overlay"><div class="card glass">
  <h1>Steak</h1><p class="sub">One cast iron pan, one gas burner, one steak. Cook it to temperature, flip it with the tongs, rest it, slice it.</p>
  <div class="grp">Cut</div><div class="chips" id="cutChips"></div>
  <div class="grp">Doneness</div><div class="chips" id="doneChips"></div>
  <div class="grp">Oil</div><div class="chips" id="oilChips"></div>
  <div class="go"><button class="btn primary" id="bStart">Heat the pan</button><span class="tip" id="loadTip"></span></div>
</div></div>

<div id="result" class="overlay" hidden><div class="card glass" id="resultCard"></div></div>
