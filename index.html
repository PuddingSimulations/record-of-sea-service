<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sea Service" />
<title>Record of Sea Service</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---- Minimal inline icons (no external icon package needed) ----
function Icon({ children, size = 20, color = 'currentColor', strokeWidth = 2, ...rest }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
         strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" {...rest}>
      {children}
    </svg>
  );
}
function Plus(props) {
  return <Icon {...props}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
}
function Trash2(props) {
  return (
    <Icon {...props}>
      <path d="M3 6h18" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <line x1="10" y1="11" x2="10" y2="17" />
      <line x1="14" y1="11" x2="14" y2="17" />
    </Icon>
  );
}
function Anchor(props) {
  return (
    <Icon {...props}>
      <circle cx="12" cy="5" r="3" />
      <line x1="12" y1="22" x2="12" y2="8" />
      <path d="M5 12H2a10 10 0 0 0 20 0h-3" />
    </Icon>
  );
}
function X(props) {
  return <Icon {...props}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
}

// ---- AMSA reference data ----
const DUTY_CATEGORIES = [
  { code: 'AEIC', name: 'Assistant to engineer in charge', group: 'Engineering' },
  { code: 'AE/ED', name: 'Assistant to engineer or engine driver', group: 'Engineering' },
  { code: 'E/ED', name: 'Engineer or engine driver', group: 'Engineering' },
  { code: 'EW', name: 'Engineer watchkeeper', group: 'Engineering' },
  { code: 'EIC', name: 'Engineer in charge', group: 'Engineering' },
  { code: 'D', name: 'Deck work', group: 'Deck' },
  { code: 'DE', name: 'Deck and engineering', group: 'Deck & Engineering' },
  { code: 'GPH', name: 'General purpose hand', group: 'Deck' },
  { code: 'INW', name: 'In charge of navigation watch / officer of watch', group: 'Deck' },
  { code: 'C', name: 'Coxswain grade 1 or 2 or 3', group: 'Deck' },
];

const GROUP_COLORS = {
  'Deck': '#3D6B6B',
  'Engineering': '#C08A3E',
  'Deck & Engineering': '#7A5C8E',
  'Other': '#6B6B6B',
};

const PROPULSION_TYPES = [
  { code: 'I', name: 'Inboard' },
  { code: 'O', name: 'Outboard' },
  { code: 'S', name: 'Steam' },
];

const OPERATION_TYPES = [
  { code: 'C', name: 'Commercial' },
  { code: 'R', name: 'Recreational' },
  { code: 'M', name: 'Military' },
];

const MODE_OF_OPERATION = [
  { code: 'VU', name: 'Underway' },
  { code: 'NUD', name: 'Not underway \u2013 deck or refit work' },
  { code: 'NUE', name: 'Not underway \u2013 engine or refit work' },
];

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' });
}

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function buildMonthGrid(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const firstWeekday = (firstOfMonth.getDay() + 6) % 7; // 0 = Monday
  const gridStart = new Date(year, month, 1 - firstWeekday);
  return Array.from({ length: 42 }, (_, i) => {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    return d;
  });
}

// ---- Local persistence (browser localStorage — works on any standalone host) ----
const STORAGE_KEY = 'sea-service-entries';

function SeaServiceTracker() {
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({
    vessel: '',
    vesselId: '',
    position: '',
    vesselLength: '',
    vesselPower: '',
    propulsion: 'I',
    operationType: 'C',
    modeOfOperation: 'VU',
    category: 'D',
    start: '',
    end: '',
    days: 1,
    notes: '',
  });
  const [autoCalc, setAutoCalc] = useState(true);
  const [calendarMonth, setCalendarMonth] = useState(() => new Date());

  function handleDayClick(dateObj) {
    const iso = isoDate(dateObj);
    setForm((f) => {
      if (!f.start || (f.start && f.end)) {
        return { ...f, start: iso, end: '' };
      }
      if (iso < f.start) {
        return { ...f, start: iso, end: f.start };
      }
      return { ...f, end: iso };
    });
  }

  function daysBetween(start, end) {
    if (!start || !end) return null;
    const s = new Date(start + 'T00:00:00');
    const e = new Date(end + 'T00:00:00');
    const diff = Math.round((e - s) / 86400000) + 1;
    return diff > 0 ? diff : null;
  }

  useEffect(() => {
    if (!autoCalc) return;
    const calculated = daysBetween(form.start, form.end);
    if (calculated !== null) {
      setForm((f) => ({ ...f, days: calculated }));
    }
  }, [form.start, form.end, autoCalc]);

  // Load once on mount
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setEntries(JSON.parse(raw));
    } catch (e) {
      // no existing data, or storage unavailable
    } finally {
      setLoaded(true);
    }
  }, []);

  // Save whenever entries change (after initial load)
  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) {
      // storage full or unavailable
    }
  }, [entries, loaded]);

  const totals = useMemo(() => {
    const map = {};
    entries.forEach((e) => {
      map[e.category] = (map[e.category] || 0) + Number(e.days);
    });
    return DUTY_CATEGORIES
      .map((c) => ({ ...c, total: map[c.code] || 0 }))
      .filter((c) => c.total > 0);
  }, [entries]);

  const grandTotal = entries.reduce((sum, e) => sum + Number(e.days), 0);

  const sortedEntries = useMemo(
    () => [...entries].sort((a, b) => (b.start || '').localeCompare(a.start || '')),
    [entries]
  );

  const knownVessels = useMemo(() => {
    const byName = new Map();
    [...entries]
      .sort((a, b) => (a.start || '').localeCompare(b.start || ''))
      .forEach((e) => {
        byName.set(e.vessel, {
          vessel: e.vessel,
          vesselId: e.vesselId || '',
          vesselLength: e.vesselLength || '',
          vesselPower: e.vesselPower || '',
          propulsion: e.propulsion || 'I',
        });
      });
    return Array.from(byName.values()).sort((a, b) => a.vessel.localeCompare(b.vessel));
  }, [entries]);

  function resetForm() {
    setForm({
      vessel: '',
      vesselId: '',
      position: '',
      vesselLength: '',
      vesselPower: '',
      propulsion: 'I',
      operationType: 'C',
      modeOfOperation: 'VU',
      category: 'D',
      start: '',
      end: '',
      days: 1,
      notes: '',
    });
    setAutoCalc(true);
    setCalendarMonth(new Date());
  }

  function handleAdd() {
    if (!form.vessel.trim() || !form.days) return;
    const entry = {
      id: (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random(),
      vessel: form.vessel.trim(),
      vesselId: form.vesselId.trim(),
      position: form.position.trim(),
      vesselLength: form.vesselLength,
      vesselPower: form.vesselPower,
      propulsion: form.propulsion,
      operationType: form.operationType,
      modeOfOperation: form.modeOfOperation,
      category: form.category,
      start: form.start,
      end: form.end,
      days: Number(form.days),
      notes: form.notes.trim(),
    };
    setEntries((prev) => [...prev, entry]);
    resetForm();
    setShowForm(false);
  }

  function handleDelete(id) {
    setEntries((prev) => prev.filter((e) => e.id !== id));
  }

  return (
    <div className="min-h-screen" style={{ backgroundColor: '#FFFFFF', fontFamily: 'system-ui, -apple-system, sans-serif' }}>
      <div className="max-w-2xl mx-auto px-4 pb-28 pt-6">
        <header className="flex items-center gap-3 mb-6">
          <div className="flex items-center justify-center rounded-full w-11 h-11 shrink-0" style={{ backgroundColor: '#1B2A4A' }}>
            <Anchor size={20} color="#FFFFFF" strokeWidth={1.75} />
          </div>
          <div>
            <h1 className="text-2xl leading-tight" style={{ color: '#1B2A4A', letterSpacing: '0.01em', fontFamily: 'system-ui, sans-serif', fontWeight: 700 }}>
              Record of Sea Service
            </h1>
            <p className="text-xs uppercase tracking-widest" style={{ color: '#6B7280', fontFamily: 'system-ui, sans-serif' }}>
              AMSA Form 771 · Near Coastal
            </p>
          </div>
        </header>

        <div className="rounded-lg px-5 py-4 mb-5 flex items-center justify-between" style={{ backgroundColor: '#1B2A4A' }}>
          <span className="text-sm" style={{ color: '#C9BFA0', fontFamily: 'system-ui, sans-serif' }}>Total qualifying days</span>
          <span className="text-3xl font-bold tabular-nums" style={{ color: '#FFFFFF', fontFamily: 'system-ui, sans-serif' }}>{grandTotal}</span>
        </div>

        {totals.length > 0 && (
          <div className="mb-6">
            <h2 className="text-xs uppercase tracking-widest mb-2 px-1" style={{ color: '#6B7280', fontFamily: 'system-ui, sans-serif' }}>
              By duty category
            </h2>
            <div className="rounded-lg overflow-hidden border" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF' }}>
              {totals.map((c, i) => (
                <div key={c.code} className="flex items-center justify-between px-4 py-2.5" style={{ borderTop: i === 0 ? 'none' : '1px solid #E8E0C8' }}>
                  <div className="flex items-center gap-2.5 min-w-0">
                    <span className="w-1.5 h-6 rounded-full shrink-0" style={{ backgroundColor: GROUP_COLORS[c.group] }} />
                    <div className="min-w-0">
                      <div className="text-sm" style={{ color: '#2A2A2A' }}>
                        {c.name}{' '}
                        <span className="text-xs" style={{ color: '#6B7280', fontFamily: 'system-ui, sans-serif' }}>({c.code})</span>
                      </div>
                    </div>
                  </div>
                  <span className="text-sm font-semibold tabular-nums shrink-0 pl-2" style={{ color: '#1B2A4A', fontFamily: 'system-ui, sans-serif' }}>
                    {c.total}d
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div>
          <h2 className="text-xs uppercase tracking-widest mb-2 px-1" style={{ color: '#6B7280', fontFamily: 'system-ui, sans-serif' }}>Entries</h2>
          {sortedEntries.length === 0 ? (
            <div className="rounded-lg border border-dashed px-4 py-8 text-center" style={{ borderColor: '#E5E7EB' }}>
              <p className="text-sm" style={{ color: '#6B7280', fontFamily: 'system-ui, sans-serif' }}>
                No entries yet. Tap the + button to log your first stretch of sea service.
              </p>
            </div>
          ) : (
            <div className="space-y-2">
              {sortedEntries.map((e) => {
                const cat = DUTY_CATEGORIES.find((c) => c.code === e.category);
                return (
                  <div key={e.id} className="rounded-lg border px-4 py-3 flex items-start justify-between gap-3" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF' }}>
                    <div className="min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-semibold" style={{ color: '#2A2A2A' }}>{e.vessel}</span>
                        <span className="text-[11px] px-1.5 py-0.5 rounded" style={{ backgroundColor: GROUP_COLORS[cat?.group] + '22', color: GROUP_COLORS[cat?.group], fontFamily: 'system-ui, sans-serif' }}>
                          {e.category}
                        </span>
                      </div>
                      <div className="text-xs mt-0.5" style={{ color: '#6B7280', fontFamily: 'system-ui, sans-serif' }}>
                        {formatDate(e.start)}{e.end ? ` \u2013 ${formatDate(e.end)}` : ''} · {e.days} day{e.days == 1 ? '' : 's'}
                      </div>
                      {(e.position || e.vesselId || e.vesselLength || e.vesselPower || e.propulsion || e.operationType || e.modeOfOperation) && (
                        <div className="text-[11px] mt-1" style={{ color: '#9CA3AF', fontFamily: 'system-ui, sans-serif' }}>
                          {[
                            e.position && `Position: ${e.position}`,
                            e.vesselId && `ID: ${e.vesselId}`,
                            (e.vesselLength || e.vesselPower) && `${e.vesselLength ? e.vesselLength + 'm' : ''}${e.vesselLength && e.vesselPower ? ', ' : ''}${e.vesselPower ? e.vesselPower + 'kW' : ''}`,
                            e.propulsion && PROPULSION_TYPES.find((p) => p.code === e.propulsion)?.name,
                            e.operationType && OPERATION_TYPES.find((o) => o.code === e.operationType)?.name,
                            e.modeOfOperation && MODE_OF_OPERATION.find((m) => m.code === e.modeOfOperation)?.name,
                          ].filter(Boolean).join(' · ')}
                        </div>
                      )}
                      {e.notes && <div className="text-xs mt-1 italic" style={{ color: '#9CA3AF' }}>{e.notes}</div>}
                    </div>
                    <button onClick={() => handleDelete(e.id)} className="shrink-0 p-1.5 rounded-full hover:bg-black/5 transition-colors" aria-label="Delete entry">
                      <Trash2 size={16} color="#9CA3AF" />
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      <button onClick={() => setShowForm(true)} className="fixed bottom-6 right-6 rounded-full w-14 h-14 flex items-center justify-center shadow-lg" style={{ backgroundColor: '#C08A3E' }} aria-label="Add sea service entry">
        <Plus size={26} color="#1B2A4A" strokeWidth={2.5} />
      </button>

      {showForm && (
        <div className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{ backgroundColor: 'rgba(27,42,74,0.45)' }} onClick={() => setShowForm(false)}>
          <div className="w-full sm:max-w-md rounded-2xl p-5 overflow-y-auto overscroll-contain" style={{ backgroundColor: '#FFFFFF', fontFamily: 'system-ui, sans-serif', maxHeight: '85vh', WebkitOverflowScrolling: 'touch' }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-semibold" style={{ color: '#1B2A4A' }}>Add Sea Service</h2>
              <button onClick={() => setShowForm(false)} className="p-1 rounded-full hover:bg-black/5">
                <X size={20} color="#6B7280" />
              </button>
            </div>

            <div className="space-y-5">
              <div className="space-y-3">
                <h3 className="text-[11px] uppercase tracking-widest font-semibold" style={{ color: '#1B2A4A' }}>Vessel details</h3>

                {knownVessels.length > 0 && (
                  <div>
                    <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Use existing vessel</label>
                    <select value="" onChange={(ev) => {
                      const name = ev.target.value;
                      if (!name) return;
                      const v = knownVessels.find((k) => k.vessel === name);
                      if (v) setForm((f) => ({ ...f, vessel: v.vessel, vesselId: v.vesselId, vesselLength: v.vesselLength, vesselPower: v.vesselPower, propulsion: v.propulsion }));
                    }} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#C08A3E', backgroundColor: '#C08A3E11', color: '#1B2A4A' }}>
                      <option value="">Select a vessel to pre-fill…</option>
                      {knownVessels.map((v) => <option key={v.vessel} value={v.vessel}>{v.vessel}</option>)}
                    </select>
                    <p className="text-[11px] mt-1" style={{ color: '#9CA3AF' }}>
                      Fills in the vessel identifier, length, power and propulsion from your last entry for that vessel. You can still edit any of it below.
                    </p>
                  </div>
                )}

                <div>
                  <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Vessel name</label>
                  <input type="text" value={form.vessel} onChange={(ev) => setForm({ ...form, vessel: ev.target.value })} placeholder="e.g. MV Southern Star" className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }} />
                </div>
                <div>
                  <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Vessel identifier</label>
                  <input type="text" value={form.vesselId} onChange={(ev) => setForm({ ...form, vesselId: ev.target.value })} placeholder="e.g. registration / call sign" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }} />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Length (m)</label>
                    <input type="number" min="0" value={form.vesselLength} onChange={(ev) => setForm({ ...form, vesselLength: ev.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }} />
                  </div>
                  <div>
                    <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Power (kW)</label>
                    <input type="number" min="0" value={form.vesselPower} onChange={(ev) => setForm({ ...form, vesselPower: ev.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }} />
                  </div>
                </div>
                <div>
                  <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Propulsion type</label>
                  <select value={form.propulsion} onChange={(ev) => setForm({ ...form, propulsion: ev.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }}>
                    {PROPULSION_TYPES.map((p) => <option key={p.code} value={p.code}>{p.name} ({p.code})</option>)}
                  </select>
                </div>
              </div>

              <div className="space-y-3 pt-4" style={{ borderTop: '1px solid #E5E7EB' }}>
                <h3 className="text-[11px] uppercase tracking-widest font-semibold" style={{ color: '#1B2A4A' }}>Operation</h3>
                <div>
                  <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Type of operation</label>
                  <select value={form.operationType} onChange={(ev) => setForm({ ...form, operationType: ev.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }}>
                    {OPERATION_TYPES.map((o) => <option key={o.code} value={o.code}>{o.name} ({o.code})</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Mode of operation</label>
                  <select value={form.modeOfOperation} onChange={(ev) => setForm({ ...form, modeOfOperation: ev.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }}>
                    {MODE_OF_OPERATION.map((m) => <option key={m.code} value={m.code}>{m.name} ({m.code})</option>)}
                  </select>
                </div>
              </div>

              <div className="space-y-3 pt-4" style={{ borderTop: '1px solid #E5E7EB' }}>
                <h3 className="text-[11px] uppercase tracking-widest font-semibold" style={{ color: '#1B2A4A' }}>Your role</h3>
                <div>
                  <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Position on board</label>
                  <input type="text" value={form.position} onChange={(ev) => setForm({ ...form, position: ev.target.value })} placeholder="e.g. Second Mate, Assistant Engineer" className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }} />
                </div>
                <div>
                  <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Duty category</label>
                  <select value={form.category} onChange={(ev) => setForm({ ...form, category: ev.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }}>
                    {DUTY_CATEGORIES.map((c) => <option key={c.code} value={c.code}>{c.name} ({c.code})</option>)}
                  </select>
                </div>
              </div>

              <div className="space-y-3 pt-4" style={{ borderTop: '1px solid #E5E7EB' }}>
                <h3 className="text-[11px] uppercase tracking-widest font-semibold" style={{ color: '#1B2A4A' }}>Sea time</h3>
                <div>
                  <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Voyage dates</label>
                  <div className="rounded-lg border p-3" style={{ borderColor: '#E5E7EB' }}>
                    <div className="flex items-center justify-between mb-3">
                      <button type="button" onClick={() => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1))} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/5" style={{ color: '#1B2A4A' }} aria-label="Previous month">‹</button>
                      <span className="text-sm font-semibold" style={{ color: '#1B2A4A' }}>{calendarMonth.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' })}</span>
                      <button type="button" onClick={() => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1))} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/5" style={{ color: '#1B2A4A' }} aria-label="Next month">›</button>
                    </div>
                    <div className="grid grid-cols-7 gap-y-1 text-center text-[10px] mb-1" style={{ color: '#9CA3AF' }}>
                      {['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((d) => <div key={d}>{d}</div>)}
                    </div>
                    <div className="grid grid-cols-7 gap-y-1">
                      {buildMonthGrid(calendarMonth).map((d, i) => {
                        const iso = isoDate(d);
                        const inCurrentMonth = d.getMonth() === calendarMonth.getMonth();
                        const isStart = iso === form.start;
                        const isEnd = iso === form.end;
                        const isEndpoint = isStart || isEnd;
                        const inRange = form.start && form.end && iso > form.start && iso < form.end;
                        return (
                          <button type="button" key={i} onClick={() => handleDayClick(d)} className="aspect-square flex items-center justify-center text-xs mx-auto rounded-full" style={{ width: '2rem', opacity: inCurrentMonth ? 1 : 0.3, backgroundColor: isEndpoint ? '#C08A3E' : inRange ? '#C08A3E33' : 'transparent', color: isEndpoint ? '#FFFFFF' : '#2A2A2A', fontWeight: isEndpoint ? 700 : 400 }}>
                            {d.getDate()}
                          </button>
                        );
                      })}
                    </div>
                    <div className="flex items-center justify-between mt-3 pt-3" style={{ borderTop: '1px solid #E5E7EB' }}>
                      <span className="text-xs" style={{ color: '#6B7280' }}>
                        {form.start ? `${formatDate(form.start)}${form.end ? ` \u2013 ${formatDate(form.end)}` : ' \u2013 select finish date'}` : 'Tap a start date, then a finish date'}
                      </span>
                      {(form.start || form.end) && (
                        <button type="button" onClick={() => setForm((f) => ({ ...f, start: '', end: '' }))} className="text-xs shrink-0 pl-2" style={{ color: '#C08A3E' }}>Clear</button>
                      )}
                    </div>
                  </div>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="block text-xs uppercase tracking-wide" style={{ color: '#6B7280' }}>Qualifying days</label>
                    <button type="button" onClick={() => setAutoCalc((v) => !v)} className="text-[11px] px-2 py-0.5 rounded-full border" style={{ borderColor: autoCalc ? '#C08A3E' : '#E5E7EB', color: autoCalc ? '#C08A3E' : '#6B7280', backgroundColor: autoCalc ? '#C08A3E22' : 'transparent' }}>
                      {autoCalc ? 'Auto (from dates)' : 'Manual'}
                    </button>
                  </div>
                  <input type="number" min="1" value={form.days} disabled={autoCalc} onChange={(ev) => setForm({ ...form, days: ev.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none disabled:opacity-60" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }} />
                  <p className="text-[11px] mt-1" style={{ color: '#9CA3AF' }}>
                    {autoCalc ? 'Counting every calendar day from start to finish, inclusive. Switch to Manual if there were days off in between that shouldn\u2019t count.' : 'A day counts if you worked 8+ hours in a 24-hour period. More than 8 hours in that period still only counts as 1 day.'}
                  </p>
                </div>
              </div>

              <div>
                <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: '#6B7280' }}>Notes (optional)</label>
                <textarea value={form.notes} onChange={(ev) => setForm({ ...form, notes: ev.target.value })} placeholder="e.g. supervisor name, task book reference" rows={2} className="w-full rounded-lg border px-3 py-2 text-sm outline-none resize-none" style={{ borderColor: '#E5E7EB', backgroundColor: '#FFFFFF', color: '#2A2A2A' }} />
              </div>

              <button onClick={handleAdd} disabled={!form.vessel.trim()} className="w-full rounded-lg py-2.5 text-sm font-semibold disabled:opacity-40" style={{ backgroundColor: '#C08A3E', color: '#1B2A4A' }}>
                Save entry
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SeaServiceTracker />);
</script>
</body>
</html>
